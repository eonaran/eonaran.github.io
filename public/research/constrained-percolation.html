<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Constrained percolation — Efe Onaran</title>
  <style>
    :root {
      color-scheme: light;
      --font-size-base: 14px;
      --background: #fff;
      --foreground: #252525;
      --muted-foreground: #666;
      --border: #dedede;
      --viz-series-1: #2587c8;
      --yellow: #edb900;
      --red: #d6332a;
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 0 0 8px; font: 14px/1.5 Arial, Helvetica, sans-serif; color: var(--foreground); background: var(--background); }
    h2, h3 { margin: 0; font-size: 16px; font-weight: 600; }
    h2 { font-size: 18px; }
    .text-small { font-size: 12px; }
    .text-muted { color: var(--muted-foreground); }
    .tabular-nums { font-variant-numeric: tabular-nums; }
    .form-label { display: block; }
    .form-range { width: 100%; margin: 8px 0; accent-color: #252525; }
    .cursor-interaction { cursor: pointer; }
    input:focus-visible { outline: 2px solid #b36b00; outline-offset: 3px; }
    @media (pointer: coarse) { .form-range { min-height: 36px; } }
  </style>
</head>
<body>
<div id="cp-tradeoff-v3">
  <div class="cp-heading">
    <h2>More choices, less energy</h2>
    <span class="text-small text-muted">One fixed environment · independent Exp(1) costs</span>
  </div>
  <div class="cp-layout">
    <div class="cp-landscape">
      <svg id="cp-map-v3" class="cp-map" role="img" aria-label="Colored random edge costs and the best directed route with a limited number of turns"></svg>
      <div class="cp-legend">
        <div class="cp-cost-key"><span class="text-small">Edge cost</span><svg id="cp-color-key-v3" role="img" aria-label="Edge costs from low to high, shown in gold through red"></svg></div>
        <div class="text-small"><span class="cp-line-key"></span>Best permitted route</div>
      </div>
    </div>
    <div class="cp-plots">
      <div class="cp-chart-panel">
        <div class="cp-chart-heading"><h3>Cost versus constraint</h3><span id="cp-gamma-v3" class="text-small tabular-nums"></span></div>
        <svg id="cp-constraint-v3" class="cp-chart" role="img" aria-label="Normalized minimum cost versus maximum turns per step"></svg>
      </div>
      <div class="cp-chart-panel">
        <div class="cp-chart-heading"><h3>Cost versus entropy</h3><span id="cp-entropy-v3" class="text-small tabular-nums"></span></div>
        <svg id="cp-entropy-plot-v3" class="cp-chart" role="img" aria-label="Normalized minimum cost versus natural logarithm of path count per step"></svg>
      </div>
    </div>
  </div>
  <div class="cp-selection">
    <div class="cp-control-labels">
      <label class="form-label" for="cp-limit-v3">Maximum turns <span id="cp-limit-label-v3" class="tabular-nums">24</span></label>
      <span id="cp-selected-cost-v3" class="tabular-nums"></span>
    </div>
    <input id="cp-limit-v3" class="form-range" type="range" min="1" max="108" step="1" value="24" />
    <div id="cp-detail-v3" class="text-small text-muted" aria-live="polite"></div>
  </div>
  <div class="cp-footer text-small text-muted">90 × 54 lattice · 144 steps per path · finite sample · select either plot or move the slider</div>
</div>

  #cp-tradeoff-v3 .cp-selection { display:flex; flex-direction:column; gap:calc(var(--font-size-base) * .35); }

<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script>

(() => {
  const root = document.getElementById('cp-tradeoff-v3');
  const data = JSON.parse(document.getElementById('cp-data-v3').textContent);
  const n = data.nx + data.ny;
  const rows = data.series.map(r => ({...r, gamma:r.limit/n, normalized:r.cost/n}));
  const maxLimit = rows.length;
  const slider = root.querySelector('#cp-limit-v3');
  const map = d3.select(root.querySelector('#cp-map-v3'));
  const key = d3.select(root.querySelector('#cp-color-key-v3'));
  const saved = null;
  let limit = saved?.grid === '90x54' && Number.isInteger(saved?.limit) ? Math.max(1,Math.min(maxLimit,saved.limit)) : 24;
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let route, routeHalo, turnDots, mapGeometry, plots = [], widthKey = '';
  const minCost = d3.min(rows,r=>r.normalized), maxCost = d3.max(rows,r=>r.normalized);
  const maxWeight = d3.max(data.edges,e=>e[3]);
  const svgNS = 'http://www.w3.org/2000/svg';

  function colorValue(token) {
    const probe = document.createElement('span');
    probe.style.color = `var(${token})`;
    root.appendChild(probe);
    const value = getComputedStyle(probe).color;
    probe.remove();
    return value;
  }
  function colors() {
    // Log scaling separates the numerous small Exp(1) costs without clipping outliers.
    const scale = d3.scaleSequential(d3.interpolateRgb(colorValue('--yellow'),colorValue('--red')))
      .domain([0,Math.log1p(maxWeight)]);
    return w => scale(Math.log1p(w));
  }
  function drawMap() {
    const width = root.querySelector('.cp-landscape').getBoundingClientRect().width;
    const step = (width-40)/data.nx;
    const height = step*data.ny+66;
    const point = ([x,y]) => [20+x*step,32+(data.ny-y)*step];
    mapGeometry = {width,height,step,point};
    map.attr('viewBox',`0 0 ${width} ${height}`).attr('height',height).selectAll('*').remove();
    map.append('title').text('Directed routes in the same random environment');
    map.append('desc').text(`Gold edges have low cost and red edges have high cost. The bold blue route minimizes total edge cost among paths with at most the selected number of turns. All routes have ${n} steps.`);
    const edgeColor = colors();
    map.append('g').selectAll('line').data(data.edges).join('line')
      .attr('x1',e=>point(e)[0]).attr('y1',e=>point(e)[1])
      .attr('x2',e=>point([e[0]+(e[2]===0),e[1]+(e[2]===1)])[0])
      .attr('y2',e=>point([e[0]+(e[2]===0),e[1]+(e[2]===1)])[1])
      .attr('stroke',e=>edgeColor(e[3])).attr('stroke-width',Math.max(.65,Math.min(1.7,step*.22)))
      .attr('stroke-opacity',.9).attr('stroke-linecap','round');
    routeHalo = map.append('path').attr('fill','none').attr('stroke','var(--background)')
      .attr('stroke-width',Math.max(3.3,Math.min(5,step*.9))).attr('stroke-linejoin','round').attr('stroke-linecap','round');
    route = map.append('path').attr('fill','none').attr('stroke','var(--viz-series-1)')
      .attr('stroke-width',Math.max(2,Math.min(3,step*.55))).attr('stroke-linejoin','round').attr('stroke-linecap','round');
    turnDots = map.append('g');
    for (const [p,label,anchor,offset] of [[[0,0],'Start','start',24],[[data.nx,data.ny],'Goal','end',-15]]) {
      const [x,y] = point(p);
      map.append('circle').attr('cx',x).attr('cy',y).attr('r',5).attr('fill','var(--foreground)')
        .attr('stroke','var(--background)').attr('stroke-width',2);
      map.append('text').attr('x',x).attr('y',y+offset).attr('text-anchor',anchor).attr('class','text-small').text(label);
    }
    key.attr('viewBox','0 0 160 38').selectAll('*').remove();
    key.append('title').text('Edge cost; logarithmic color scale, with every edge cost retained');
    const defs=key.append('defs');
    const gradient=defs.append('linearGradient').attr('id','cp-cost-gradient-v3');
    for(let i=0;i<=30;i++) {
      const w=Math.expm1(i/30*Math.log1p(maxWeight));
      gradient.append('stop').attr('offset',`${100*i/30}%`).attr('stop-color',edgeColor(w));
    }
    key.append('rect').attr('x',3).attr('y',3).attr('width',152).attr('height',9).attr('fill','url(#cp-cost-gradient-v3)');
    const scale=d3.scaleLog().domain([1,1+maxWeight]).range([3,155]);
    for(const [w,label,anchor] of [[0,'0','start'],[1,'1','middle'],[3,'3','middle'],[maxWeight,maxWeight.toFixed(1),'end']]) {
      key.append('text').attr('x',scale(w+1)).attr('y',30).attr('text-anchor',anchor).text(label);
    }
  }

  function makePlot(selector, field, xlabel) {
    const element=root.querySelector(selector), svg=d3.select(element);
    const width=element.parentElement.getBoundingClientRect().width;
    const height=218, m={left:64,right:18,top:15,bottom:51};
    const frame={left:m.left,right:width-m.right,top:m.top,bottom:height-m.bottom};
    svg.attr('viewBox',`0 0 ${width} ${height}`).attr('height',height).selectAll('*').remove();
    svg.append('title').text(field==='gamma'?'Normalized cost against turn allowance':'Normalized cost against finite path-family entropy');
    svg.append('desc').text(`The plotted points are computed for this single environment. The vertical coordinate is total cost divided by ${n}. Straight segments join adjacent computed values; no curve is fitted. Select a point to display its route.`);
    const [a,b]=d3.extent(rows,r=>r[field]);
    const x=d3.scaleLinear().domain([Math.max(0,a-.03*(b-a)),b+.03*(b-a)]).range([frame.left+5,frame.right-5]);
    const [lo,hi]=d3.extent(rows,r=>r.normalized), pad=.09*(hi-lo);
    const y=d3.scaleLinear().domain([Math.max(0,lo-pad),hi+pad]).range([frame.bottom-5,frame.top+5]);
    const ticks=y.ticks(3);
    svg.append('g').selectAll('line').data(ticks).join('line')
      .attr('x1',frame.left).attr('x2',frame.right).attr('y1',d=>y(d)).attr('y2',d=>y(d))
      .attr('stroke','var(--border)').attr('stroke-opacity',.6);
    svg.append('rect').attr('data-chart-frame','').attr('x',frame.left).attr('y',frame.top)
      .attr('width',frame.right-frame.left).attr('height',frame.bottom-frame.top)
      .attr('fill','none').attr('stroke','var(--border)').attr('stroke-width',1);
    svg.append('g').attr('transform',`translate(0,${frame.bottom})`).call(d3.axisBottom(x).ticks(width<370?3:4).tickSizeOuter(0).tickFormat(d3.format('.1f')));
    svg.append('g').attr('transform',`translate(${frame.left},0)`).call(d3.axisLeft(y).tickValues(ticks).tickSizeOuter(0).tickFormat(d3.format('.1f')));
    svg.append('text').attr('class','axis-title').attr('data-axis','x').attr('x',(frame.left+frame.right)/2)
      .attr('y',height-10).attr('text-anchor','middle').text(xlabel);
    svg.append('text').attr('class','axis-title').attr('data-axis','y').attr('transform',`translate(16,${(frame.top+frame.bottom)/2}) rotate(-90)`)
      .attr('text-anchor','middle').text('Cost per step');
    const line=d3.line().x(r=>x(r[field])).y(r=>y(r.normalized));
    svg.append('path').datum(rows).attr('d',line).attr('fill','none').attr('stroke','var(--viz-series-1)').attr('stroke-width',2);
    svg.append('g').selectAll('circle').data(rows).join('circle')
      .attr('cx',r=>x(r[field])).attr('cy',r=>y(r.normalized)).attr('r',1.3).attr('fill','var(--viz-series-1)');
    const guide=svg.append('line').attr('stroke','var(--muted-foreground)').attr('stroke-width',1)
      .attr('stroke-dasharray','3 4').attr('y1',frame.top).attr('y2',frame.bottom);
    const marker=svg.append('circle').attr('r',5).attr('fill','var(--viz-series-1)')
      .attr('stroke','var(--background)').attr('stroke-width',2);
    const pick=event=>{
      const px=d3.pointer(event,element)[0], i=d3.bisector(r=>r[field]).center(rows,x.invert(px));
      choose(rows[i].limit,true);
    };
    let dragging=false;
    svg.append('rect').attr('data-chart-hit','').attr('class','cursor-interaction')
      .attr('x',frame.left).attr('y',frame.top).attr('width',frame.right-frame.left).attr('height',frame.bottom-frame.top)
      .attr('fill','transparent').style('touch-action','pan-y')
      .on('pointerdown',function(event){dragging=true;this.setPointerCapture(event.pointerId);pick(event);})
      .on('pointermove',event=>{if(dragging)pick(event);})
      .on('pointerup',()=>{dragging=false;}).on('pointercancel',()=>{dragging=false;});
    return {field,x,y,marker,guide};
  }

  function choose(k,persist=false,animate=true) {
    limit=Math.max(1,Math.min(maxLimit,k));slider.value=limit;
    const row=rows[limit-1];
    root.querySelector('#cp-limit-label-v3').textContent=limit;
    root.querySelector('#cp-selected-cost-v3').textContent=`Cost per step ${row.normalized.toFixed(3)}`;
    root.querySelector('#cp-gamma-v3').textContent=`γ = ${row.gamma.toFixed(3)}`;
    root.querySelector('#cp-entropy-v3').textContent=`h = ${row.h.toFixed(3)}`;
    const detail=root.querySelector('#cp-detail-v3');
    const parts=[document.createTextNode(`${row.turns} turns used · `)];
    if(Number(row.count)<10000) {
      parts.push(document.createTextNode(Number(row.count).toLocaleString()));
    } else {
      const [mantissa,exponent]=Number(row.count).toExponential(2).split('e');
      parts.push(document.createTextNode(`≈ ${Number(mantissa)} × 10`));
      const superscript=document.createElement('sup');
      superscript.textContent=Number(exponent).toString();
      parts.push(superscript);
    }
    parts.push(document.createTextNode(` permitted paths · ${(100*(1-row.cost/rows[0].cost)).toFixed(0)}% less cost than the best one-turn route`));
    detail.replaceChildren(...parts);
    const d=d3.line().x(p=>mapGeometry.point(p)[0]).y(p=>mapGeometry.point(p)[1])(row.path);
    // A route changes discretely; no interpolation into off-lattice paths.
    route.attr('d',d);routeHalo.attr('d',d);
    const turns=row.path.filter((p,i,ps)=>i>0&&i<ps.length-1&&((p[0]-ps[i-1][0])!==(ps[i+1][0]-p[0])));
    turnDots.selectAll('circle').data(turns).join('circle').attr('cx',p=>mapGeometry.point(p)[0]).attr('cy',p=>mapGeometry.point(p)[1])
      .attr('r',Math.max(.8,Math.min(1.6,mapGeometry.step*.25))).attr('fill','var(--background)').attr('stroke','var(--viz-series-1)').attr('stroke-width',1);
    for(const plot of plots) {
      const cx=plot.x(row[plot.field]),cy=plot.y(row.normalized);
      plot.marker.interrupt();plot.guide.interrupt();
      const marker=animate&&!reduceMotion?plot.marker.transition().duration(180):plot.marker;
      const guide=animate&&!reduceMotion?plot.guide.transition().duration(180):plot.guide;
      marker.attr('cx',cx).attr('cy',cy);guide.attr('x1',cx).attr('x2',cx);
      plot.marker.attr('data-tooltip',`k = ${limit}; cost/step = ${row.normalized.toFixed(3)}; entropy = ${row.h.toFixed(3)} nats/step`);
    }
  }
  function draw(force=false) {
    const widths=[root.getBoundingClientRect().width,...root.querySelectorAll('.cp-chart-panel')].map(e=>typeof e==='number'?Math.round(e):Math.round(e.getBoundingClientRect().width)).join(',');
    if(!force&&widths===widthKey)return;widthKey=widths;
    drawMap();
    plots=[makePlot('#cp-constraint-v3','gamma','Turn allowance γ (turns/step)'),makePlot('#cp-entropy-plot-v3','h','Entropy h (nats/step)')];
    choose(limit,false,false);
  }
  slider.addEventListener('input',()=>choose(Number(slider.value)));
  slider.addEventListener('change',()=>choose(Number(slider.value),true));
  new ResizeObserver(()=>draw()).observe(root);
  new MutationObserver(()=>draw(true)).observe(document.documentElement,{attributes:true,attributeFilter:['class','style','data-theme']});
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>draw(true));
  draw(true);
})();
</script>

<script>
  (() => {
    let lastHeight = 0;
    const report = () => {
      const height = Math.ceil(document.body.getBoundingClientRect().height);
      if (height !== lastHeight) {
        lastHeight = height;
        if (parent !== window) parent.postMessage({ type: "percolation-figure-height", height }, window.location.origin);
      }
    };
    new ResizeObserver(report).observe(document.body);
    window.addEventListener("load", report);
    report();
  })();
</script>
</body>
</html>
